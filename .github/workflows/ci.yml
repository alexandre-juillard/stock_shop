name: CI

on:
  push:
    branches:
      - develop
      - "feature/**"

  pull_request:
    branches:
      - develop
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
            distribution: temurin
            java-version: "25"
            cache: maven

      - name: Build project
        run: mvn clean verify