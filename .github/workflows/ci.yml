name: CI

on:
  push:
    branches:
      - "feature/**"

  pull_request:
    branches:
      - develop
      - main

  # Analyse de vulnérabilités hebdomadaire, indépendamment de tout push/PR
  # (de nouvelles CVE peuvent apparaître sur des dépendances déjà en place)
  schedule:
    - cron: "0 6 * * 1" # tous les lundis à 06h00 UTC

  # Permet de déclencher manuellement le workflow (ex: pour lancer le scan à la demande)
  workflow_dispatch:

jobs:
  commitlint:
    runs-on: ubuntu-latest
    # Filet de securite : ne s'applique qu'aux Pull Requests (les hooks Husky
    # locaux valident deja chaque commit au moment de sa creation/push)
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lint commit messages
        uses: wagoid/commitlint-github-action@v6

  build:
    runs-on: ubuntu-latest
    # Ce job ne concerne que le code : inutile de le relancer sur le déclenchement planifié
    if: github.event_name != 'schedule'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
            distribution: temurin
            java-version: "25"
            cache: maven

      - name: Build project
        run: mvn clean verify

      # if: always() -> le rapport JaCoCo est généré en phase "verify", après
      # Spotless/SpotBugs : on veut pouvoir le consulter même si un de ces
      # checks échoue (les tests ont déjà tourné avant). Si le fichier
      # n'existe pas (échec très en amont), l'étape avertit sans faire échouer le job.
      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 30

      - name: Upload SpotBugs report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-report
          path: target/spotbugsXml.xml
          retention-days: 30

      # Uniquement si le build a réussi : le jar final (on exclut le
      # ".jar.original" laissé par le plugin Spring Boot avant repackaging).
      - name: Upload application JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: stock-api-jar
          path: |
            target/*.jar
            !target/*.jar.original
          retention-days: 30

  dependency-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
            distribution: temurin
            java-version: "25"
            cache: maven

      - name: Get current week number
        id: date
        run: echo "week=$(date +'%Y-%U')" >> "$GITHUB_OUTPUT"

      - name: Cache OWASP Dependency-Check NVD database
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          # La base NVD évolue quotidiennement, on invalide donc le cache chaque semaine
          key: owasp-dependency-check-nvd-${{ steps.date.outputs.week }}
          restore-keys: |
            owasp-dependency-check-nvd-

      - name: OWASP Dependency Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: >
          mvn org.owasp:dependency-check-maven:check
          -Powasp-check
          -Dnvd.api.key="${NVD_API_KEY}"

      - name: Upload Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
          retention-days: 30

  docker-build:
    runs-on: ubuntu-latest
    # Ce job construit et scanne l'image de production : inutile sur le
    # déclenchement planifié (le contenu du Dockerfile n'a pas changé)
    if: github.event_name != 'schedule'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: stock-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Get current week number
        id: date
        run: echo "week=$(date +'%Y-%U')" >> "$GITHUB_OUTPUT"

      - name: Cache Trivy vulnerability database
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          # La base Trivy évolue quotidiennement, on invalide donc le cache chaque semaine
          key: trivy-db-${{ steps.date.outputs.week }}
          restore-keys: |
            trivy-db-

      # Scanne l'image finale (stage "runtime") : OS Alpine + paquets système,
      # en complément du scan OWASP qui ne couvre que les dépendances Maven/npm.
      # Génère d'abord le rapport SARIF (exit-code 0 : ne bloque jamais cette
      # étape) afin qu'il soit toujours disponible pour l'upload suivant,
      # même si le scan de blocage plus bas échoue.
      - name: Scan Docker image with Trivy (rapport SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: stock-api:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          # On limite volontairement ce job aux CVE (OS + dépendances) : le
          # scan de secrets est un sujet distinct (analyse du code source dans
          # son ensemble, pas de l'image runtime buildée) et gérerait mal les
          # faux positifs sur des valeurs par défaut de dev (voir application-dev.yml).
          scanners: "vuln"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
          skip-version-check: true

      # Publie le rapport dans l'onglet "Security > Code scanning" du repo.
      # continue-on-error : sur un repo privé sans GitHub Advanced Security,
      # cet upload peut être refusé par GitHub ; cela ne doit pas invalider
      # le scan Trivy lui-même.
      - name: Upload Trivy scan results to GitHub Security tab
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      # Rejoue le scan en affichant un tableau lisible directement dans les logs
      # (le format sarif ci-dessus n'affiche rien en console) et fait échouer le
      # job si une CVE CRITICAL/HIGH corrigible est trouvée. ignore-unfixed=true :
      # on ne bloque que sur des failles pour lesquelles un correctif existe déjà
      # (bloquer sur du non-corrigible dans l'image de base serait un blocage
      # sans action possible).
      - name: Scan Docker image with Trivy (gate)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: stock-api:${{ github.sha }}
          format: table
          scanners: "vuln"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          skip-version-check: true

