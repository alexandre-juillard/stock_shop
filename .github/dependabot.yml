version: 2

updates:
  # --- Dépendances Maven (pom.xml : dépendances applicatives + plugins) ---
  - package-ecosystem: "maven"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"
    groups:
      # Mises à jour mineures/correctifs regroupées dans une seule PR pour limiter le bruit
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      # Les montées de version majeures (ex: Spring Boot 4 -> 5) ne sont PAS groupées :
      # chaque dépendance concernée reçoit sa propre PR, à examiner individuellement.

  # --- GitHub Actions utilisées dans les workflows (actions/checkout, setup-java, cache, ...) ---
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
    groups:
      github-actions:
        update-types:
          - "minor"
          - "patch"

  # --- Images de base Docker (Dockerfile : eclipse-temurin) ---
  - package-ecosystem: "docker"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(docker)"
      include: "scope"

