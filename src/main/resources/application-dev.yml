spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:stock_api}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:admin1234}
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    fr.stockshop: DEBUG
    org.hibernate.SQL: DEBUG
