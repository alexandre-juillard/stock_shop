spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:stock_api}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:admin1234}
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  # En local, pointe par défaut vers Mailpit (voir docker-compose.yaml) : un serveur SMTP de
  # développement sans authentification, avec une interface web de consultation des emails reçus
  # (http://localhost:8025). Aucun compte SMTP réel n'est nécessaire pour tester l'envoi d'email.
  # Pour utiliser un service externe (ex: Mailtrap), définir SMTP_HOST/SMTP_PORT/SMTP_USER/
  # SMTP_PASSWORD/SMTP_AUTH/SMTP_STARTTLS dans le fichier .env.
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}

app:
  mail:
    from: ${MAIL_FROM:no-reply@stockshop.fr}

# Secret de développement UNIQUEMENT (64 octets encodés en base64).
# Ne jamais réutiliser cette valeur en production : définir JWT_SECRET dans l'environnement.
security:
  jwt:
    secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWtleS1kby1ub3QtdXNlLWluLXByb2R1Y3Rpb24tcGxlYXNlLWNoYW5nZS1tZQ==}

logging:
  level:
    fr.stockshop: DEBUG
    org.hibernate.SQL: DEBUG
