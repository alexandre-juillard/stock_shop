spring:
  application:
    name: stock-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
  health:
    # SMTP indisponible = email non envoyé (déjà géré côté service, sans erreur pour l'appelant),
    # pas une panne de l'application : ce health check ne doit donc pas faire passer /actuator/health en DOWN.
    mail:
      enabled: false

security:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900000}
    refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

app:
  mail:
    from: ${MAIL_FROM}
    # Durée de validité des jetons de confirmation de compte / réinitialisation de mot de passe
    # (format Duration Spring Boot : "24h", "PT24H", "30m"...).
    token-expiration: ${TOKEN_EXPIRATION:24h}
  frontend:
    # Base URL de l'application front (utilisée pour construire les liens envoyés par email).
    base-url: ${FRONTEND_BASE_URL:http://localhost:3000}

springdoc:
  api-docs:
    enabled: true

logging:
  level:
    root: INFO
    fr.stockshop: INFO
