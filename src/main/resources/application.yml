spring:
  application:
    name: stock-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  servlet:
    multipart:
      max-file-size: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:5MB}
      max-request-size: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:5MB}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid,profile,email
            # {baseUrl} = schéma+hôte+port de l'API ; doit correspondre exactement au Redirect URI
            # déclaré dans Google Cloud Console pour cet environnement.
            redirect-uri: "{baseUrl}/api/auth/oauth2/callback"

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
  health:
    # SMTP indisponible = email non envoyé (déjà géré côté service, sans erreur pour l'appelant),
    # pas une panne de l'application : ce health check ne doit donc pas faire passer /actuator/health en DOWN.
    mail:
      enabled: false

security:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900000}
    # Durée du refresh token quand rememberMe=true ("Se souvenir de moi", AC-2 du ticket connexion).
    refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}
  session:
    # Durée du refresh token quand rememberMe=false/absent : session plus courte,
    # non "mémorisée" au-delà de quelques heures.
    default-expiration: ${SESSION_DEFAULT_EXPIRATION:43200000}

app:
  mail:
    from: ${MAIL_FROM}
    # Durée de validité des jetons de confirmation de compte / réinitialisation de mot de passe
    # (format Duration Spring Boot : "24h", "PT24H", "30m"...).
    token-expiration: ${TOKEN_EXPIRATION:24h}
    # Durée de validité du jeton de réinitialisation de mot de passe, plus courte car plus sensible.
    reset-token-expiration: ${RESET_TOKEN_EXPIRATION:1h}
  oauth2:
    # Durée de validité du linkContext proposé lors d'une liaison de compte OAuth2 (AUTH-007).
    link-context-expiration: ${OAUTH2_LINK_CONTEXT_EXPIRATION:10m}
  storage:
    # Répertoire de stockage local des avatars en développement / première version.
    avatar-directory: ${AVATAR_STORAGE_DIR:uploads/avatars}
    avatar-max-size: ${AVATAR_MAX_SIZE:5MB}
  frontend:
    # Base URL de l'application front (utilisée pour construire les liens envoyés par email).
    base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
  i18n:
    # Langues effectivement supportées par l'application (voir src/main/resources/i18n/).
    # Ajouter une langue : créer messages_xx.properties puis ajouter son code ici, sans
    # modification de code ni migration de base de données.
    supported-locales: ${SUPPORTED_LOCALES:fr,en}

springdoc:
  api-docs:
    enabled: true

logging:
  level:
    root: INFO
    fr.stockshop: INFO
