spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false
  # Aucune valeur par défaut : ces variables doivent impérativement être fournies par
  # l'environnement en production (mêmes exigences que JWT_SECRET ci-dessous).
  mail:
    host: ${SMTP_HOST}
    username: ${SMTP_USER}
    password: ${SMTP_PASSWORD}

# Aucune valeur par défaut : JWT_SECRET doit impérativement être fourni par l'environnement
# (secret aléatoire d'au moins 64 octets, encodé en base64). L'application refuse de démarrer sinon.
security:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900000}
    refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}

app:
  mail:
    from: ${MAIL_FROM}

logging:
  level:
    root: WARN
    fr.stockshop: INFO
