spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true

# Secret de test UNIQUEMENT, jamais utilisé en dehors de l'environnement de test.
security:
  jwt:
    secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWtleS1kby1ub3QtdXNlLWluLXByb2R1Y3Rpb24tcGxlYXNlLWNoYW5nZS1tZQ==}
    access-token-expiration: 900000
    refresh-token-expiration: 604800000

springdoc:
  api-docs:
    enabled: false

logging:
  level:
    root: WARN
    fr.stockshop: INFO
    org.testcontainers: INFO
    com.github.dockerjava: WARN

