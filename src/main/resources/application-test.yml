spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
  # Port 3025 = port par défaut du serveur SMTP en mémoire GreenMail (ServerSetupTest.SMTP),
  # utilisé par EmailServiceTest. Les autres tests n'envoient pas d'email : ces valeurs ne servent
  # qu'à permettre le démarrage du contexte Spring (le bean JavaMailSender est créé mais jamais
  # sollicité en dehors de EmailServiceTest). Aucun username/password : JavaMailSenderImpl
  # tenterait sinon une connexion SMTP authentifiée, que GreenMail (sans utilisateur configuré)
  # rejetterait.
  #
  # host = 127.0.0.1 (et non "localhost") : GreenMail n'écoute que sur l'interface IPv4 loopback.
  # Sur certaines machines Windows, "localhost" se résout en priorité vers ::1 (IPv6), ce qui fait
  # échouer/pendre la connexion (aucun listener sur ce côté) et rend les tests d'envoi d'email
  # flaky (l'envoi @Async reste bloqué bien au-delà de la fenêtre d'attente du test).
  # connectiontimeout/timeout/writetimeout : échec rapide en cas de mauvaise résolution réseau
  # plutôt qu'un blocage prolongé du pool de threads @Async partagé.
  mail:
    host: ${SMTP_HOST:127.0.0.1}
    port: ${SMTP_PORT:3025}
    properties:
      mail:
        smtp:
          auth: false
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          starttls:
            enable: false

# Secret de test UNIQUEMENT, jamais utilisé en dehors de l'environnement de test.
security:
  jwt:
    secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWtleS1kby1ub3QtdXNlLWluLXByb2R1Y3Rpb24tcGxlYXNlLWNoYW5nZS1tZQ==}
    access-token-expiration: 900000
    refresh-token-expiration: 604800000

springdoc:
  api-docs:
    enabled: false

app:
  mail:
    from: ${MAIL_FROM:no-reply@stockshop.fr}
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:3000}

logging:
  level:
    root: WARN
    fr.stockshop: INFO
    org.testcontainers: INFO
    com.github.dockerjava: WARN

